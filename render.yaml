services:
  - type: web
    name: hookcatch
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 2 --bind 0.0.0.0:$PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4
      # Point this to your Neon database connection string.
      # Get it from https://console.neon.tech/ → your project → Connection string
      # Format: postgresql://user:password@host/database
      - key: DATABASE_URL
        value: # paste your Neon connection string here
