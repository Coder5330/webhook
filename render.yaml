services:
  - type: web
    name: hookcatch
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      - key: DATA_DIR
        value: /var/data
    # Disks require a paid instance type (Starter or above) — remove this
    # block to run on the free plan, but the SQLite file will then be wiped
    # on every redeploy (it still survives simple restarts/sleep-wake).
    disk:
      name: hookcatch-data
      mountPath: /var/data
      sizeGB: 1
